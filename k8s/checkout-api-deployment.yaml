apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: freshcart

spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  
  template:
    metadata:
      labels:
        app: checkout-api

    spec:
      containers:
        - name: checkout-api
          image: 055505191746.dkr.ecr.eu-north-1.amazonaws.com/freshcart-checkout-api:v4
          
          ports:
            - containerPort: 3000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: checkout-api-secrets
                  key: database-url

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

     
           