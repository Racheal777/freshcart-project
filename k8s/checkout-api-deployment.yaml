apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: freshcart

spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  
  template:
    metadata:
      labels:
        app: checkout-api

    spec:
      containers:
        - name: checkout-api
          image: 055505191746.dkr.ecr.eu-north-1.amazonaws.com/freshcart-checkout-api:3a33385dfe832bb6d22ecef29a53472865ddfe68
          
          ports:
            - containerPort: 3000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: checkout-api-secrets
                  key: database-url
            - name: NODE_OPTIONS
              value: "--require @opentelemetry/auto-instrumentations-node/register"
            - name: OTEL_SERVICE_NAME
              value: checkout-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://tempo.monitoring.svc.cluster.local:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_NODE_RESOURCE_DETECTORS
              value: env,host,os

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000

            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /livez
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

     
           