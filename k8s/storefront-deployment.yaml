apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: freshcart

spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  
  template:
    metadata:
      labels:
        app: storefront

    spec:
      containers:
        - name: storefront
          image: 055505191746.dkr.ecr.eu-north-1.amazonaws.com/freshcart-storefront:v2
          
          ports:
            - containerPort: 8080

          