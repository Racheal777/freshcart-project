apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-api-allow
  namespace: freshcart

spec:
  podSelector:
    matchLabels:
      app: checkout-api
  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: storefront
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx