apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: freshcart-gateway
  namespace: freshcart
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: freshcart-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80