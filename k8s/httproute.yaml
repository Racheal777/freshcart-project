apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: freshcart-routes
  namespace: freshcart
spec:
  parentRefs:
    - name: freshcart-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: checkout-api
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: storefront
          port: 8080