apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-deployer
  namespace: freshcart

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: freshcart

rules:
 - apiGroups: ["apps"]
   resources: ["deployments"]
   verbs: ["get", "list", "create", "update", "patch"]

 - apiGroups: [""]
   resources: ["services"]
   verbs: ["get", "list", "create", "update", "patch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-deployer-binding
  namespace: freshcart

subjects:
  - kind: ServiceAccount
    name: pipeline-deployer 
    namespace: freshcart

roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io

