


services:
  checkout-api:
    build: ./checkout-api
    ports:
      - "3000:3000"
    env_file:
      - ./checkout-api/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/freshcart
      NODE_OPTIONS: "--require @opentelemetry/auto-instrumentations-node/register"
      OTEL_SERVICE_NAME: checkout-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      
   

  db:
    image: postgres:16-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freshcart
    ports:
      - "5433:5432"

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./checkout-api/db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  
  web:
    build: ./storefront
    ports:
      - "8080:8080"

    env_file:
      - ./storefront/.env
    depends_on:
     checkout-api:
      condition: service_healthy

    restart: unless-stopped



  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - checkout-api
    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3001:3000"
  
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:587
      GF_SMTP_USER: kuranchieracheal@gmail.com
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: kuranchieracheal@gmail.com
      GF_SMTP_FROM_NAME: FreshCart Alerts
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped


  loki:
    image: grafana/loki:3.5.0
    ports:
      - "3100:3100"
    restart: unless-stopped


  alloy:
    image: grafana/alloy:v1.10.0
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped


  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    restart: unless-stopped

volumes:
 db_data:
 grafana_data:


networks:
  default:
    name: freshcart_network



        

  
