name: Freshcart CI

on:
  push:
    branches: [main]
  
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

  steps:
   - name: checkout code
     uses: actions/checkout@v6

   - name: Use nodejs
     uses: actions/setup-node@v7
     with:
        node-version: '20.x'
        cache: 'npm'

  -  name: install dependencies
     run: npm install 

  -  name: lint code
     run: npm run lint

  -  name: Run tests
     run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest

  steps:
   
    - name: checkout code
      uses: actions/checkout@v6

    - name: build docker image
      run: docker build -t freshcart-checkout-api .
 



