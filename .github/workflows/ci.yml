name: Freshcart CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'checkout-api/package-lock.json'

      - name: Install dependencies
        run: npm ci

    

  

    

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t freshcart-checkout-api:latest \
            -t freshcart-checkout-api:${{ github.sha }} .

      - name: scan for vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: freshcart-checkout-api:latest
          only-severity: critical,high
          exit-code: true

      - name: scan with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: freshcart-checkout-api:latest
       
          exit-code: '1'
          severity-threshold: CRITICAL,HIGH