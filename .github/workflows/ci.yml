name: Freshcart CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'checkout-api/package-lock.json'

      - name: Install dependencies
        run: npm ci

    

  

    

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checkout-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t freshcart-checkout-api:latest \
            -t freshcart-checkout-api:${{ github.sha }} .


      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2

     
      - name: scan with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: freshcart-checkout-api:latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          scanners: 'vuln'
          ignore-unfixed: true
          format: 'table'
         
        env:
            TRIVY_DISABLE_VEX_NOTICE: 'true'
    