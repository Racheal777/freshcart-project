alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp

  config:
    global:
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: kuranchieracheal@gmail.com
      smtp_auth_username: kuranchieracheal@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true

    route:
      receiver: "null"
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: racheal-email
          matchers:
            - severity =~ "page|ticket"

    receivers:
      - name: "null"
      - name: racheal-email
        email_configs:
          - to: kuranchieracheal35@gmail.com
            send_resolved: true